<title>Range la chambre de Lili-Rose !</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(#bcecf5,#fff7dd);color:#0b3265;touch-action:none}
header{max-width:1180px;margin:14px auto 8px;padding:0 14px;display:flex;gap:12px;align-items:stretch}
.title{background:white;border-radius:22px;padding:12px 22px;font-weight:900;font-size:clamp(25px,4vw,52px);box-shadow:0 5px 15px #0002;flex:1}
.task{background:#fff7d8;border:3px solid #f1c75b;border-radius:22px;padding:10px 18px;min-width:34%;display:flex;flex-direction:column;justify-content:center}
.task small{font-weight:800;color:#63758b} #instruction{font-size:clamp(17px,2vw,27px);font-weight:900;margin-top:3px}
main{max-width:1180px;margin:auto;padding:0 14px 22px}
.roomwrap{position:relative;background:white;border:7px solid white;border-radius:25px;overflow:hidden;box-shadow:0 8px 24px #0003}
#room{width:100%;display:block;pointer-events:none}
.placed{position:absolute;width:11%;max-width:125px;z-index:5;filter:drop-shadow(0 4px 3px #0005);touch-action:none;user-select:none}
.placed img{width:100%;border-radius:12px;display:block}
.hint{position:absolute;width:13%;aspect-ratio:1;border:5px dashed #f3a600;border-radius:50%;transform:translate(-50%,-50%);display:none;z-index:3;background:#fff4}
.controls{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:11px 18px;font-weight:900;font-size:16px;cursor:pointer}
#check{background:#0b74d1;color:white} #hintBtn{background:#ffe69a;color:#173c69} #reset{background:#eee;color:#333}
#feedback{min-height:28px;text-align:center;font-size:20px;font-weight:900}
.tray{background:white;border-radius:22px;padding:12px;display:grid;grid-template-columns:repeat(10,1fr);gap:8px;box-shadow:0 6px 18px #0002}
.card{border:3px solid #f1d27b;border-radius:15px;background:#fffdf5;padding:5px;text-align:center;font-weight:800;touch-action:none;user-select:none;cursor:grab}
.card.active{outline:5px solid #46b5e8;transform:translateY(-4px)} .card.done{opacity:.35}
.card img{width:100%;aspect-ratio:1/1.15;object-fit:cover;border-radius:10px;pointer-events:none} .card span{display:block;font-size:13px;margin-top:2px}
.progress{font-weight:900;text-align:center;margin:8px}
@media(max-width:800px){.tray{grid-template-columns:repeat(5,1fr)} header{display:block}.task{margin-top:8px} .card span{font-size:11px}}
</style></head>

<script>
const cmds=[{"item": "le ballon", "text": "Mets le ballon à gauche du lit.", "x": 29, "y": 50}, {"item": "le sac", "text": "Mets le sac à droite du bureau.", "x": 67, "y": 24}, {"item": "les baskets", "text": "Mets les baskets sous le bureau.", "x": 54, "y": 34}, {"item": "les chaussons", "text": "Mets les chaussons à côté du lit.", "x": 73, "y": 62}, {"item": "la tablette", "text": "Mets la tablette sur le bureau.", "x": 55, "y": 20}, {"item": "le cahier", "text": "Mets le cahier devant les livres.", "x": 57, "y": 73}, {"item": "le jean", "text": "Mets le jean derrière la chaise.", "x": 56, "y": 31}, {"item": "la trousse", "text": "Mets la trousse à droite du cahier.", "x": 62, "y": 73}, {"item": "les clés", "text": "Mets les clés sur l’étagère.", "x": 51, "y": 9}, {"item": "le livre", "text": "Mets le livre à gauche de la tablette.", "x": 49, "y": 20}];
let step=0, selected=null, positions={};
const board=document.getElementById('board'), hint=document.getElementById('hint');
const cards=[...document.querySelectorAll('.card')];

function showTask(){
 if(step>=cmds.length){
  document.getElementById('count').textContent='Bravo !';
  document.getElementById('instruction').textContent='La chambre est rangée !';
  document.getElementById('feedback').textContent='🎉 Super ! Tu as rangé les 10 objets.';
  return;
 }
 document.getElementById('count').textContent=`Consigne ${step+1} / 10`;
 document.getElementById('instruction').textContent=cmds[step].text;
 cards.forEach(c=>c.classList.toggle('active',c.dataset.name===cmds[step].item));
 hint.style.display='none';
}
function place(name,x,y){
 let el=document.querySelector(`.placed[data-name="${name}"]`);
 if(!el){
   const card=cards.find(c=>c.dataset.name===name);
   el=document.createElement('div'); el.className='placed'; el.dataset.name=name;
   el.innerHTML=`<img src="${card.querySelector('img').src}">`; board.appendChild(el);
   addDrag(el);
 }
 el.style.left=x+'%'; el.style.top=y+'%'; el.style.transform='translate(-50%,-50%)';
 positions[name]={x,y};
}
function coords(e){
 const r=board.getBoundingClientRect(), p=e.touches?e.touches[0]:e;
 return {x:(p.clientX-r.left)/r.width*100,y:(p.clientY-r.top)/r.height*100};
}
function addDrag(el){
 el.addEventListener('pointerdown',e=>{selected=el; el.setPointerCapture(e.pointerId); e.preventDefault()});
 el.addEventListener('pointermove',e=>{if(selected!==el)return; const p=coords(e); place(el.dataset.name,p.x,p.y)});
 el.addEventListener('pointerup',()=>selected=null);
}
cards.forEach(card=>{
 card.addEventListener('pointerdown',e=>{
   if(card.classList.contains('done'))return;
   selected=card; card.setPointerCapture(e.pointerId); e.preventDefault();
 });
 card.addEventListener('pointerup',e=>{
   if(selected!==card)return; const p=coords(e);
   const r=board.getBoundingClientRect();
   if(e.clientY>=r.top && e.clientY<=r.bottom && e.clientX>=r.left && e.clientX<=r.right) place(card.dataset.name,p.x,p.y);
   selected=null;
 });
});
document.getElementById('check').onclick=()=>{
 if(step>=10)return; const c=cmds[step], p=positions[c.item];
 if(!p){document.getElementById('feedback').textContent='👉 Déplace d’abord le bon objet.';return}
 const d=Math.hypot(p.x-c.x,p.y-c.y);
 if(d<12){
   document.getElementById('feedback').textContent='✅ Très bien !';
   cards.find(x=>x.dataset.name===c.item).classList.add('done');
   step++; document.getElementById('progress').textContent=`${step} / 10 objets rangés`;
   setTimeout(()=>{document.getElementById('feedback').textContent='';showTask()},650);
 } else document.getElementById('feedback').textContent='❌ Pas encore. Essaie encore !';
};
document.getElementById('hintBtn').onclick=()=>{
 if(step>=10)return; const c=cmds[step]; hint.style.left=c.x+'%';hint.style.top=c.y+'%';hint.style.display='block';
 setTimeout(()=>hint.style.display='none',1800);
};
document.getElementById('reset').onclick=()=>location.reload();
showTask();
</script></body></html>
